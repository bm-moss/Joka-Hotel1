<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joka · Kitchen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .order-badge { display:inline-block;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:700;text-transform:uppercase; }
    .badge-guest { background:rgba(245,158,11,.15);color:#fbbf24; }
    .use-btn { padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);cursor:pointer;font-size:.78rem;transition:all .15s; }
    .use-btn:hover { background:var(--danger);color:#fff;border-color:var(--danger); }
    .chef-panel { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px; }
    .chef-panel h3 { margin-bottom:14px;font-size:1rem; }
    .ing-row { display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border); }
    .ing-row:last-child { border-bottom:none; }
    .ing-name { flex:1;font-size:.875rem; }
    .ing-qty  { font-size:.875rem;color:var(--text-muted);min-width:80px;text-align:right; }
    .ing-input { width:70px;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.82rem; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">

    <!-- topbar -->
    <div class="topbar" id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 id="pageTitle">ኩሽና</h1>
        <span id="roleTag" class="badge badge-blue" style="font-size:.75rem"></span>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle">
          <button class="lang-btn" data-lang="am" onclick="setLang('am')">አማ</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
        <span style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--accent2)">
          <span style="width:8px;height:8px;background:var(--accent2);border-radius:50%;animation:blink 1.5s infinite"></span>
          LIVE
        </span>
      </div>
    </div>

    <div class="page-content">

      <!-- stats row -->
      <div style="display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap">
        <div class="stat-card" style="flex:1;min-width:120px;padding:14px">
          <div class="label" data-i18n="pending">በመጠባበቅ</div>
          <div class="value" id="cntPending" style="font-size:2rem">0</div>
        </div>
        <div class="stat-card green" style="flex:1;min-width:120px;padding:14px">
          <div class="label" data-i18n="ready">ዝግጁ</div>
          <div class="value" id="cntReady" style="font-size:2rem">0</div>
        </div>
        <button class="btn btn-ghost" onclick="loadOrders()">🔄 Refresh</button>
      </div>

      <!-- Chef-only: ingredient usage panel -->
      <div id="chefPanel" style="display:none">
        <div class="chef-panel">
          <h3>🧂 Use Ingredients from Stock</h3>
          <div id="ingList">
            <p style="color:var(--text-dim);font-size:.85rem">Loading inventory…</p>
          </div>
        </div>
      </div>

      <!-- order cards -->
      <div class="kitchen-grid" id="kitchenGrid">
        <p style="color:var(--text-dim)" data-i18n="loading">በመጫን ላይ…</p>
      </div>

    </div>
  </div>
</div>

<!-- use ingredient modal (chef only) -->
<div class="modal-overlay" id="useIngModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h3>🧂 Use Ingredient</h3>
      <button class="modal-close" onclick="closeModal('useIngModal')">✕</button>
    </div>
    <p id="useIngName" style="font-weight:600;margin-bottom:16px;color:var(--accent2)"></p>
    <div class="form-group">
      <label>Amount to use</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="form-control" id="useIngAmt" type="number" min="0.01" step="0.01" placeholder="0">
        <span id="useIngUnit" style="color:var(--text-muted);min-width:50px"></span>
      </div>
      <p id="useIngStock" style="font-size:.78rem;color:var(--text-muted);margin-top:6px"></p>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-ghost btn-full" onclick="closeModal('useIngModal')" data-i18n="cancel">ሰርዝ</button>
      <button class="btn btn-danger btn-full" onclick="confirmUseIng()">Confirm Use</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
<script>
Auth.require(['kitchen','chef','admin','cashier']);
buildSidebar('kitchen');

const user    = Auth.user();
const isChef  = user && user.role === 'chef';
let inventory = [];
let selectedIng = null;

// set role tag
document.getElementById('roleTag').textContent = isChef ? '👨‍🍳 Chef' : '🍳 Kitchen';
document.getElementById('pageTitle').textContent = isChef ? 'Chef Station' : t('kitchen');

if (isChef) {
  document.getElementById('chefPanel').style.display = 'block';
  loadInventory();
}

/* ── inventory (chef) ── */
async function loadInventory() {
  const res = await api('GET', '/api/inventory');
  if (!res) return;
  inventory = await res.json();
  renderIngredients();
}

function renderIngredients() {
  const el = document.getElementById('ingList');
  if (!inventory.length) { el.innerHTML = '<p style="color:var(--text-dim)">No inventory items</p>'; return; }
  el.innerHTML = inventory.map(i => {
    const low = i.quantity <= i.minThreshold;
    return `<div class="ing-row">
      <div class="ing-name">
        <strong>${currentLang === 'am' && i.amharicName ? i.amharicName : i.materialName}</strong>
        ${low ? '<span class="badge badge-red" style="margin-left:6px">LOW</span>' : ''}
      </div>
      <div class="ing-qty">${i.quantity} ${i.unit}</div>
      <button class="use-btn" onclick="openUseIng('${i.id}')">Use</button>
    </div>`;
  }).join('');
}

function openUseIng(id) {
  selectedIng = inventory.find(i => i.id === id);
  if (!selectedIng) return;
  document.getElementById('useIngName').textContent = selectedIng.materialName + (selectedIng.amharicName ? ' / ' + selectedIng.amharicName : '');
  document.getElementById('useIngUnit').textContent = selectedIng.unit;
  document.getElementById('useIngStock').textContent = 'In stock: ' + selectedIng.quantity + ' ' + selectedIng.unit;
  document.getElementById('useIngAmt').value = '';
  openModal('useIngModal');
}

async function confirmUseIng() {
  if (!selectedIng) return;
  const amt = parseFloat(document.getElementById('useIngAmt').value);
  if (!amt || amt <= 0) { toast('Enter a valid amount', 'error'); return; }
  const res = await api('POST', '/api/inventory/remove', { id: selectedIng.id, amount: amt });
  if (!res) return;
  const d = await res.json();
  if (d.ok) {
    toast(`Used ${amt} ${selectedIng.unit} of ${selectedIng.materialName}`, 'success');
    closeModal('useIngModal');
    loadInventory();
  } else {
    toast(d.msg || t('error'), 'error');
  }
}

/* ── orders ── */
async function loadOrders() {
  const res = await api('GET', '/api/orders/pending');
  if (!res) return;
  const orders = await res.json();

  document.getElementById('cntPending').textContent = orders.filter(o => o.kitchenStatus === 'pending').length;
  document.getElementById('cntReady').textContent   = orders.filter(o => o.kitchenStatus === 'ready').length;

  const g = document.getElementById('kitchenGrid');
  const foodOrders = orders.filter(o => o.items && o.items.some(i => i.category === 'Food'));

  if (!foodOrders.length) {
    g.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-dim)">
      <div style="font-size:3rem">✅</div>
      <p style="margin-top:8px">No pending food orders</p>
    </div>`;
    return;
  }

  g.innerHTML = foodOrders.map(o => {
    const food = o.items.filter(i => i.category === 'Food');
    const mins = Math.floor((Date.now() - new Date(o.createdAt)) / 60000);
    const rdy  = o.kitchenStatus === 'ready';
    const urgentStyle = mins >= 15 ? 'border-left-color:var(--danger)' : mins >= 8 ? 'border-left-color:var(--warn)' : '';

    return `<div class="kitchen-card ${rdy ? 'ready' : ''}" style="${urgentStyle}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div class="order-id">Order #${o.id.slice(-6).toUpperCase()}</div>
        <div style="display:flex;gap:6px;align-items:center">
          ${o.isGuest ? '<span class="order-badge badge-guest">Guest</span>' : ''}
          ${o.tableNumber ? `<span class="badge badge-blue">Table ${o.tableNumber}</span>` : ''}
        </div>
      </div>
      <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:10px">
        ${o.isGuest ? '👤 ' + o.cashierName : '🛒 ' + (o.cashierName || o.cashier)}
      </div>
      <div class="order-items">
        ${food.map(i => `
          <div class="order-item-row">
            <span>${currentLang === 'am' && i.amharicName ? i.amharicName : i.name}</span>
            <span style="font-weight:700;color:var(--accent2)">×${i.qty}</span>
          </div>`).join('')}
      </div>
      ${o.note ? `<div style="font-size:.78rem;color:var(--warn);margin-top:8px;padding:6px 8px;background:rgba(245,158,11,.08);border-radius:6px">📝 ${o.note}</div>` : ''}
      <div class="timer" style="${mins >= 15 ? 'color:var(--danger)' : mins >= 8 ? 'color:var(--warn)' : ''}">
        ⏱ ${mins === 0 ? 'Just now' : mins + ' min ago'}
        ${mins >= 15 ? ' ⚠️ URGENT' : ''}
      </div>
      ${!rdy
        ? `<button class="btn btn-success btn-full btn-sm" style="margin-top:12px" onclick="markReady('${o.id}')">
             ✅ ${t('markReady')}
           </button>`
        : `<div style="color:var(--accent2);font-weight:600;margin-top:12px;text-align:center;padding:8px;background:rgba(16,185,129,.08);border-radius:6px">
             ✅ ${t('ready')} — Waiting for pickup
           </div>`}
    </div>`;
  }).join('');
}

async function markReady(id) {
  const res = await api('PATCH', `/api/orders/${id}/kitchen`);
  if (!res) return;
  const d = await res.json();
  if (d.ok) { toast(t('kitchenReady'), 'success'); loadOrders(); }
  else toast(d.msg || t('error'), 'error');
}

loadOrders();
setInterval(loadOrders, 8000);
if (isChef) setInterval(loadInventory, 30000);
</script>
</body>
</html>
